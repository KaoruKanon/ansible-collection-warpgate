---
# defaults file for plopoyop.warpgate
# @var warpgate_system_user
# @var warpgate_system_user:type: string
# @var warpgate_system_user:description: >
# System user name to create
warpgate_system_user: "warpgate"

# @var warpgate_system_group
# @var warpgate_system_group:type: string
# @var warpgate_system_group:description: >
# System group name to create
warpgate_system_group: "warpgate"

# @var warpgate_version
# @var warpgate_version:type: string
# @var warpgate_version:description: >
# warpgate version to install
warpgate_version: 0.27.1

# @var warpgate_install_method
# @var warpgate_install_method:type: string
# @var warpgate_install_method:description: >
# How warpgate is installed and run: "binary" installs the standalone
# release binary and manages it via systemd, "docker" runs the official
# Warpgate container image via the Docker Engine (see the "Docker"
# variables below).
warpgate_install_method: "binary"

# @var warpgate_service_state
# @var warpgate_service_state:type: string
# @var warpgate_service_state:description: >
# warpgate service desired state
warpgate_service_state: "started"

# @var warpgate_service_enabled
# @var warpgate_service_enabled:type: boolean
# @var warpgate_service_enabled:description: >
# Enable warpgate service
warpgate_service_enabled: true


# @var warpgate_data_path
# @var warpgate_data_path:type: string
# @var warpgate_data_path:description: >
# Warpgate data path: config file, SQLite database (if used), TLS
# certificates, SSH host keys and session recordings all live under it.
# When warpgate_install_method is "docker" this is the path *inside the
# container* (fixed to /data by the official image) — use
# warpgate_docker_host_data_path to control where that data actually
# lives on the host.
warpgate_data_path: "{{ '/data' if warpgate_install_method == 'docker' else '/var/lib/warpgate' }}"

# @var warpgate_config_file_path
# @var warpgate_config_file_path:type: string
# @var warpgate_config_file_path:description: >
# Warpgate config path
warpgate_config_file_path: "{{ warpgate_config_file_directory }}/warpgate.yaml"

# @var warpgate_http_port
# @var warpgate_http_port:type: int
# @var warpgate_http_port:description: >
# Warpgate HTTP port
warpgate_http_port: 8888

# @var warpgate_ssh_enabled
# @var warpgate_ssh_enabled:type: boolean
# @var warpgate_ssh_enabled:description: >
# Warpgate SSH enabled
warpgate_ssh_enabled: false

# @var warpgate_ssh_port
# @var warpgate_ssh_port:type: int
# @var warpgate_ssh_port:description: >
# Warpgate SSH port
warpgate_ssh_port: 2222

# @var warpgate_admin_password
# @var warpgate_admin_password:type: string
# @var warpgate_admin_password:description: >
# Warpgate admin password

# @var warpgate_database_backend
# @var warpgate_database_backend:type: string
# @var warpgate_database_backend:description: >
# Backend datastore used by warpgate itself to store its own state
# (users, roles, targets, sessions, ...): "sqlite" or "postgres". This is
# unrelated to warpgate_postgres_enabled below, which only controls
# whether warpgate exposes a PostgreSQL-protocol *listener* used to proxy
# connections to PostgreSQL targets.
warpgate_database_backend: "sqlite"

# @var warpgate_database_postgres_host
# @var warpgate_database_postgres_host:type: string
# @var warpgate_database_postgres_host:description: >
# Hostname of the PostgreSQL server used as warpgate's own database
# (only used when warpgate_database_backend is "postgres")
warpgate_database_postgres_host: "localhost"

# @var warpgate_database_postgres_port
# @var warpgate_database_postgres_port:type: int
# @var warpgate_database_postgres_port:description: >
# Port of the PostgreSQL server used as warpgate's own database
warpgate_database_postgres_port: 5432

# @var warpgate_database_postgres_database
# @var warpgate_database_postgres_database:type: string
# @var warpgate_database_postgres_database:description: >
# Database name used as warpgate's own database
warpgate_database_postgres_database: "warpgate"

# @var warpgate_database_postgres_username
# @var warpgate_database_postgres_username:type: string
# @var warpgate_database_postgres_username:description: >
# Username used to connect to warpgate's own PostgreSQL database
warpgate_database_postgres_username: "warpgate"

# @var warpgate_database_postgres_password
# @var warpgate_database_postgres_password:type: string
# @var warpgate_database_postgres_password:description: >
# Password used to connect to warpgate's own PostgreSQL database
# (required when warpgate_database_backend is "postgres")

# @var warpgate_database_postgres_sslmode
# @var warpgate_database_postgres_sslmode:type: string
# @var warpgate_database_postgres_sslmode:description: >
# sslmode query parameter appended to the generated database URL (e.g.
# "disable", "require", "verify-full"). null omits the parameter.
warpgate_database_postgres_sslmode: null

# @var warpgate_database_url
# @var warpgate_database_url:type: string
# @var warpgate_database_url:description: >
# Warpgate database URL. Auto-generated from warpgate_database_backend
# and, when set to "postgres", the warpgate_database_postgres_*
# variables above. Set this variable directly to bypass the generated
# value entirely.
warpgate_database_url: >-
  {{
    (
      'postgres://' ~ (warpgate_database_postgres_username | urlencode) ~ ':' ~ (warpgate_database_postgres_password | urlencode)
      ~ '@' ~ warpgate_database_postgres_host ~ ':' ~ warpgate_database_postgres_port ~ '/' ~ warpgate_database_postgres_database
      ~ (('?sslmode=' ~ warpgate_database_postgres_sslmode) if warpgate_database_postgres_sslmode else '')
    )
    if warpgate_database_backend == 'postgres'
    else ('sqlite:' ~ warpgate_data_path ~ '/warpgate.db')
  }}

# @var warpgate_mysql_enabled
# @var warpgate_mysql_enabled:type: boolean
# @var warpgate_mysql_enabled:description: >
# Warpgate MySQL enabled
warpgate_mysql_enabled: false

# @var warpgate_mysql_port
# @var warpgate_mysql_port:type: int
# @var warpgate_mysql_port:description: >
# Warpgate MySQL port
warpgate_mysql_port: 33306

# @var warpgate_postgres_enabled
# @var warpgate_postgres_enabled:type: boolean
# @var warpgate_postgres_enabled:description: >
# Enable warpgate's PostgreSQL-protocol *listener*, used to proxy client
# connections through to PostgreSQL targets. Unrelated to
# warpgate_database_backend, which selects warpgate's own storage engine.
warpgate_postgres_enabled: false

# @var warpgate_postgres_port
# @var warpgate_postgres_port:type: int
# @var warpgate_postgres_port:description: >
# Warpgate PostgreSQL listener port
warpgate_postgres_port: 55432

# @var warpgate_record_sessions
# @var warpgate_record_sessions:type: boolean
# @var warpgate_record_sessions:description: >
# Warpgate record sessions
warpgate_record_sessions: true

# @var warpgate_external_host
# @var warpgate_external_host:type: string
# @var warpgate_external_host:description: >
# Warpgate external host
warpgate_external_host: "localhost"

# @var warpgate_kubernetes_enabled
# @var warpgate_kubernetes_enabled:type: boolean
# @var warpgate_kubernetes_enabled:description: >
# Warpgate Kubernetes enabled
warpgate_kubernetes_enabled: false

# @var warpgate_kubernetes_port
# @var warpgate_kubernetes_port:type: int
# @var warpgate_kubernetes_port:description: >
# Warpgate Kubernetes port
warpgate_kubernetes_port: 8443

# @var warpgate_sso_providers
# @var warpgate_sso_providers:type: list
# @var warpgate_sso_providers:description: >
# Warpgate SSO providers
warpgate_sso_providers: []

# @var warpgate_recordings_path
# @var warpgate_recordings_path:type: string
# @var warpgate_recordings_path:description: >
# Path where session recordings are stored
warpgate_recordings_path: "{{ warpgate_data_path }}/recordings"

# @var warpgate_tls_certificate_path
# @var warpgate_tls_certificate_path:type: string
# @var warpgate_tls_certificate_path:description: >
# Default TLS certificate path used by HTTP / Kubernetes / MySQL / PostgreSQL listeners
warpgate_tls_certificate_path: "{{ warpgate_data_path }}/tls.certificate.pem"

# @var warpgate_tls_key_path
# @var warpgate_tls_key_path:type: string
# @var warpgate_tls_key_path:description: >
# Default TLS key path used by HTTP / Kubernetes / MySQL / PostgreSQL listeners
warpgate_tls_key_path: "{{ warpgate_data_path }}/tls.key.pem"

# -----------------------------------------------------------------------------
# SSH listener
# -----------------------------------------------------------------------------

# @var warpgate_ssh_external_host
# @var warpgate_ssh_external_host:type: string
# @var warpgate_ssh_external_host:description: >
# Public hostname advertised for the SSH listener (null = auto)
warpgate_ssh_external_host: null

# @var warpgate_ssh_external_port
# @var warpgate_ssh_external_port:type: int
# @var warpgate_ssh_external_port:description: >
# Public port advertised for the SSH listener (null = auto)
warpgate_ssh_external_port: null

# @var warpgate_ssh_keys_path
# @var warpgate_ssh_keys_path:type: string
# @var warpgate_ssh_keys_path:description: >
# Directory holding Warpgate's SSH host keys
warpgate_ssh_keys_path: "{{ warpgate_data_path }}/ssh-keys"

# @var warpgate_ssh_host_key_verification
# @var warpgate_ssh_host_key_verification:type: string
# @var warpgate_ssh_host_key_verification:description: >
# SSH target host key verification mode (prompt, auto, strict)
warpgate_ssh_host_key_verification: "prompt"

# @var warpgate_ssh_inactivity_timeout
# @var warpgate_ssh_inactivity_timeout:type: string
# @var warpgate_ssh_inactivity_timeout:description: >
# Idle timeout before an SSH session is closed
warpgate_ssh_inactivity_timeout: "5m"

# @var warpgate_ssh_keepalive_interval
# @var warpgate_ssh_keepalive_interval:type: string
# @var warpgate_ssh_keepalive_interval:description: >
# Keepalive interval for SSH sessions (null disables keepalive)
warpgate_ssh_keepalive_interval: null

# -----------------------------------------------------------------------------
# HTTP listener
# -----------------------------------------------------------------------------

# @var warpgate_http_external_host
# @var warpgate_http_external_host:type: string
# @var warpgate_http_external_host:description: >
# Public hostname advertised for the HTTP listener (null = auto)
warpgate_http_external_host: null

# @var warpgate_http_external_port
# @var warpgate_http_external_port:type: int
# @var warpgate_http_external_port:description: >
# Public port advertised for the HTTP listener (null = auto)
warpgate_http_external_port: null

# @var warpgate_http_certificate
# @var warpgate_http_certificate:type: string
# @var warpgate_http_certificate:description: >
# TLS certificate path for the HTTP listener
warpgate_http_certificate: "{{ warpgate_tls_certificate_path }}"

# @var warpgate_http_key
# @var warpgate_http_key:type: string
# @var warpgate_http_key:description: >
# TLS key path for the HTTP listener
warpgate_http_key: "{{ warpgate_tls_key_path }}"

# @var warpgate_http_trust_x_forwarded_headers
# @var warpgate_http_trust_x_forwarded_headers:type: boolean
# @var warpgate_http_trust_x_forwarded_headers:description: >
# Trust X-Forwarded-* headers (enable only when running behind a trusted reverse proxy)
warpgate_http_trust_x_forwarded_headers: false

# @var warpgate_http_session_max_age
# @var warpgate_http_session_max_age:type: string
# @var warpgate_http_session_max_age:description: >
# Maximum lifetime of an HTTP session
warpgate_http_session_max_age: "30m"

# @var warpgate_http_cookie_max_age
# @var warpgate_http_cookie_max_age:type: string
# @var warpgate_http_cookie_max_age:description: >
# Maximum lifetime of the auth cookie
warpgate_http_cookie_max_age: "1day"

# @var warpgate_http_sni_certificates
# @var warpgate_http_sni_certificates:type: list
# @var warpgate_http_sni_certificates:description: >
# Additional SNI certificates for the HTTP listener
warpgate_http_sni_certificates: []

# -----------------------------------------------------------------------------
# Kubernetes listener
# -----------------------------------------------------------------------------

# @var warpgate_kubernetes_external_host
# @var warpgate_kubernetes_external_host:type: string
# @var warpgate_kubernetes_external_host:description: >
# Public hostname advertised for the Kubernetes listener (null = auto)
warpgate_kubernetes_external_host: null

# @var warpgate_kubernetes_external_port
# @var warpgate_kubernetes_external_port:type: int
# @var warpgate_kubernetes_external_port:description: >
# Public port advertised for the Kubernetes listener (null = auto)
warpgate_kubernetes_external_port: null

# @var warpgate_kubernetes_certificate
# @var warpgate_kubernetes_certificate:type: string
# @var warpgate_kubernetes_certificate:description: >
# TLS certificate path for the Kubernetes listener
warpgate_kubernetes_certificate: "{{ warpgate_tls_certificate_path }}"

# @var warpgate_kubernetes_key
# @var warpgate_kubernetes_key:type: string
# @var warpgate_kubernetes_key:description: >
# TLS key path for the Kubernetes listener
warpgate_kubernetes_key: "{{ warpgate_tls_key_path }}"

# @var warpgate_kubernetes_session_max_age
# @var warpgate_kubernetes_session_max_age:type: string
# @var warpgate_kubernetes_session_max_age:description: >
# Maximum lifetime of a Kubernetes session
warpgate_kubernetes_session_max_age: "30m"

# -----------------------------------------------------------------------------
# MySQL listener
# -----------------------------------------------------------------------------

# @var warpgate_mysql_external_host
# @var warpgate_mysql_external_host:type: string
# @var warpgate_mysql_external_host:description: >
# Public hostname advertised for the MySQL listener (null = auto)
warpgate_mysql_external_host: null

# @var warpgate_mysql_external_port
# @var warpgate_mysql_external_port:type: int
# @var warpgate_mysql_external_port:description: >
# Public port advertised for the MySQL listener (null = auto)
warpgate_mysql_external_port: null

# @var warpgate_mysql_certificate
# @var warpgate_mysql_certificate:type: string
# @var warpgate_mysql_certificate:description: >
# TLS certificate path for the MySQL listener
warpgate_mysql_certificate: "{{ warpgate_tls_certificate_path }}"

# @var warpgate_mysql_key
# @var warpgate_mysql_key:type: string
# @var warpgate_mysql_key:description: >
# TLS key path for the MySQL listener
warpgate_mysql_key: "{{ warpgate_tls_key_path }}"

# -----------------------------------------------------------------------------
# PostgreSQL listener
# -----------------------------------------------------------------------------

# @var warpgate_postgres_external_host
# @var warpgate_postgres_external_host:type: string
# @var warpgate_postgres_external_host:description: >
# Public hostname advertised for the PostgreSQL listener (null = auto)
warpgate_postgres_external_host: null

# @var warpgate_postgres_external_port
# @var warpgate_postgres_external_port:type: int
# @var warpgate_postgres_external_port:description: >
# Public port advertised for the PostgreSQL listener (null = auto)
warpgate_postgres_external_port: null

# @var warpgate_postgres_certificate
# @var warpgate_postgres_certificate:type: string
# @var warpgate_postgres_certificate:description: >
# TLS certificate path for the PostgreSQL listener
warpgate_postgres_certificate: "{{ warpgate_tls_certificate_path }}"

# @var warpgate_postgres_key
# @var warpgate_postgres_key:type: string
# @var warpgate_postgres_key:description: >
# TLS key path for the PostgreSQL listener
warpgate_postgres_key: "{{ warpgate_tls_key_path }}"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

# @var warpgate_log_retention
# @var warpgate_log_retention:type: string
# @var warpgate_log_retention:description: >
# Log retention duration
warpgate_log_retention: "7days"

# @var warpgate_log_audit_retention
# @var warpgate_log_audit_retention:type: string
# @var warpgate_log_audit_retention:description: >
# Audit log retention duration
warpgate_log_audit_retention: "11months 30days 3h 50m 24s"

# @var warpgate_log_send_to
# @var warpgate_log_send_to:type: string
# @var warpgate_log_send_to:description: >
# Remote log endpoint (null = log locally only)
warpgate_log_send_to: null

# @var warpgate_log_format
# @var warpgate_log_format:type: string
# @var warpgate_log_format:description: >
# Log output format (text or json)
warpgate_log_format: "text"

# -----------------------------------------------------------------------------
# Docker (only used when warpgate_install_method == "docker")
# -----------------------------------------------------------------------------

# @var warpgate_docker_image
# @var warpgate_docker_image:type: string
# @var warpgate_docker_image:description: >
# Warpgate Docker image name
warpgate_docker_image: "ghcr.io/warp-tech/warpgate"

# @var warpgate_docker_image_tag
# @var warpgate_docker_image_tag:type: string
# @var warpgate_docker_image_tag:description: >
# Warpgate Docker image tag
warpgate_docker_image_tag: "{{ warpgate_version }}"

# @var warpgate_docker_pull
# @var warpgate_docker_pull:type: boolean
# @var warpgate_docker_pull:description: >
# Always re-pull the image, even if a matching tag is already present locally
warpgate_docker_pull: true

# @var warpgate_docker_container_name
# @var warpgate_docker_container_name:type: string
# @var warpgate_docker_container_name:description: >
# Name of the Warpgate Docker container
warpgate_docker_container_name: "warpgate"

# @var warpgate_docker_host_data_path
# @var warpgate_docker_host_data_path:type: string
# @var warpgate_docker_host_data_path:description: >
# Host path bind-mounted to the container's /data directory (config
# file, database, TLS material, recordings, SSH host keys)
warpgate_docker_host_data_path: "/var/lib/warpgate"

# @var warpgate_docker_restart_policy
# @var warpgate_docker_restart_policy:type: string
# @var warpgate_docker_restart_policy:description: >
# Docker restart policy applied while warpgate_service_enabled is true
# (no, always, on-failure, unless-stopped)
warpgate_docker_restart_policy: "unless-stopped"

# @var warpgate_docker_network_mode
# @var warpgate_docker_network_mode:type: string
# @var warpgate_docker_network_mode:description: >
# Docker network mode for the container (e.g. "bridge", "host"). null
# uses the Docker default.
warpgate_docker_network_mode: null

# @var warpgate_docker_publish_ports
# @var warpgate_docker_publish_ports:type: boolean
# @var warpgate_docker_publish_ports:description: >
# Automatically publish the enabled listener ports (HTTP, and SSH /
# MySQL / PostgreSQL / Kubernetes when enabled) on the same host port
# number. Disable to manage publishing yourself via
# warpgate_docker_extra_ports (e.g. when warpgate_docker_network_mode is
# "host").
warpgate_docker_publish_ports: true

# @var warpgate_docker_extra_ports
# @var warpgate_docker_extra_ports:type: list
# @var warpgate_docker_extra_ports:description: >
# Additional Docker port mappings, e.g. ["8443:8443"]
warpgate_docker_extra_ports: []

# @var warpgate_docker_extra_volumes
# @var warpgate_docker_extra_volumes:type: list
# @var warpgate_docker_extra_volumes:description: >
# Additional Docker volume mounts, e.g.
# ["/etc/ssl/extra-ca.pem:/etc/ssl/extra-ca.pem:ro"]
warpgate_docker_extra_volumes: []

# @var warpgate_docker_extra_env
# @var warpgate_docker_extra_env:type: dict
# @var warpgate_docker_extra_env:description: >
# Additional environment variables passed to the container
warpgate_docker_extra_env: {}

# @var warpgate_docker_extra_hosts
# @var warpgate_docker_extra_hosts:type: list
# @var warpgate_docker_extra_hosts:description: >
# Additional /etc/hosts entries for the container, e.g.
# ["db.internal:10.0.0.5"]
warpgate_docker_extra_hosts: []

# @var warpgate_docker_log_driver
# @var warpgate_docker_log_driver:type: string
# @var warpgate_docker_log_driver:description: >
# Docker logging driver for the container (null = Docker default)
warpgate_docker_log_driver: null
