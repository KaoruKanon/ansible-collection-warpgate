---
# handlers file for plopoyop.warpgate
- name: "Restart Warpgate"
  ansible.builtin.service:
    name: "{{ warpgate_service_name }}"
    state: "restarted"
  when: warpgate_service_state == "started" and warpgate_service_enabled

- name: "Reload Systemd"
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: "Restart Warpgate Docker container"
  community.docker.docker_container:
    name: "{{ warpgate_docker_container_name }}"
    state: "started"
    restart: true
  when: warpgate_service_state == "started" and warpgate_service_enabled
